<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CHŁOPKÓW POLONIA</title>
<meta name="description" content="CHŁOPKÓW POLONIA - pikselowa przygoda przez prawdziwą wieś.">
<meta property="og:title" content="CHŁOPKÓW POLONIA">
<meta property="og:description" content="CHŁOPKÓW POLONIA - pikselowa przygoda przez prawdziwą wieś.">
<meta property="og:type" content="website">
<meta property="og:image" content="img/og-polonia.png">
<link rel="icon" type="image/png" href="img/favicon-polonia.png">
<link rel="preload" as="image" href="img/boot-logo.png" fetchpriority="high">
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #boot-splash {
    position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center;
    background: #000; opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity 650ms ease;
  }
  #boot-splash.boot-map-in { opacity: 0; }
  #boot-splash[hidden] { display: none; }
  #boot-splash-logo {
    display: block; width: min(76vw, 560px); max-height: 72vh; height: auto; object-fit: contain;
    opacity: 1; transition: opacity 450ms ease;
  }
  #boot-splash.boot-logo-out #boot-splash-logo { opacity: 0; }
  #boot-splash-title {
    display: none; max-width: 90vw; color: #fff; font: 700 clamp(1.25rem, 6vw, 3rem)/1.2 system-ui, sans-serif;
    letter-spacing: .08em; text-align: center; padding: 1rem;
    opacity: 1; transition: opacity 450ms ease;
  }
  #boot-splash.boot-logo-out #boot-splash-title { opacity: 0; }
  #boot-splash.logo-missing #boot-splash-logo { display: none; }
  #boot-splash.logo-missing #boot-splash-title { display: block; }
  #boot-splash-error-box {
    display: none; position: absolute; inset: auto 1rem 12vh; margin: auto; max-width: 32rem;
    color: #fff; text-align: center; font: 1rem/1.5 system-ui, sans-serif;
  }
  #boot-splash.boot-error #boot-splash-error-box { display: block; }
  #boot-splash-error { white-space: pre-wrap; overflow-wrap: anywhere; }
  #boot-splash-reload {
    margin-top: .75rem; padding: .65rem 1rem; border: 1px solid #fff; border-radius: .25rem;
    background: #111; color: #fff; font: inherit; cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) {
    #boot-splash, #boot-splash-logo, #boot-splash-title { transition-duration: 0ms; }
  }
</style>
</head>
<body>
<div id="boot-splash" role="status" aria-live="polite" aria-label="Ładowanie CHŁOPKÓW POLONII">
  <img id="boot-splash-logo" src="img/boot-logo.png" width="768" height="544" loading="eager" fetchpriority="high" alt="CHŁOPKÓW POLONIA">
  <div id="boot-splash-title" role="img" aria-label="CHŁOPKÓW POLONIA">CHŁOPKÓW POLONIA</div>
  <div id="boot-splash-error-box" role="alert">
    <div id="boot-splash-error"></div>
    <button id="boot-splash-reload" type="button">Spróbuj ponownie</button>
  </div>
</div>
<script src="js/loading-splash.js"></script>

<script defer src="js/boards/sprint.js"></script>
<script defer src="js/brawl.js"></script>

<script defer src="js/game.js"></script>
<script defer src="js/chat.js"></script>
<script defer src="js/missions.js"></script>
</body>
</html>
